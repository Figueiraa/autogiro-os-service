name: CI/CD

# Pipeline de CI/CD do autogiro-os-service: build, testes e qualidade, independente dos outros serviços.
#
# Os nomes dos jobs são as checagens obrigatórias da `main` (ruleset
# main-protection): mudar um nome aqui exige atualizar o ruleset.
#   Lint & Test        -> ruff, bandit, pytest com cobertura mínima de 80%
#   SonarCloud         -> análise de qualidade com quality gate bloqueante
#   Build & Push image -> imagem Docker + scan de vulnerabilidades (trivy)
#
# Deploy (EKS) roda depois, só na main e com o cluster no ar (DEPLOY_ENABLED);
# não é checagem obrigatória porque não existe em pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual da main: o script que sobe o cluster publica os serviços.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Em PR, um push novo cancela a execução anterior. Na main, não: cortar a
# pipeline no meio de um deploy deixaria o rollout pela metade.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── CI: lint + segurança + testes com cobertura ───────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    # PostgreSQL de verdade, na mesma versão do Neon, para validar as migrations.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autogiro_os
          POSTGRES_USER: autogiro
          POSTGRES_PASSWORD: autogiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autogiro -d autogiro_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # RabbitMQ de verdade para os testes de mensageria (publicação, consumo, retry e DLQ).
      rabbitmq:
        image: rabbitmq:4.0-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://autogiro:autogiro@localhost:5432/autogiro_os
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Security scan (bandit)
        run: bandit -r app -f screen -ll

      # O gate de 80% está no pytest.ini e reprova o job se a cobertura cair.
      - name: Tests (pytest + cobertura mínima de 80%)
        run: pytest

      - name: Coverage summary
        if: always()
        run: python scripts/test_report_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            report/junit.xml
            coverage.xml
            htmlcov/
          retention-days: 30

  # ─── Qualidade: SonarCloud com quality gate bloqueante ─────────────────────
  sonar:
    name: SonarCloud
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o SonarCloud usa o blame para identificar o código novo.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports

      # `sonar.qualitygate.wait=true` faz o job esperar o resultado do quality
      # gate e falhar se ele reprovar, bloqueando o merge pela checagem obrigatória.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ─── Build da imagem + scan de vulnerabilidades ────────────────────────────
  build:
    name: Build & Push image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Os nós do EKS são Graviton (t4g): a imagem publicada precisa de arm64.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Em PR: só amd64, carregada no Docker local para o scan. Nada é publicado.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Na main: amd64 + arm64, publicada com a tag do commit e `latest`.
      - name: Build and push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Falha o job se a imagem tiver vulnerabilidade CRITICAL ou HIGH com correção disponível.
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ─── CD: deploy no EKS ─────────────────────────────────────────────────────
  # Só na main e só com o cluster no ar: a variável DEPLOY_ENABLED do repositório
  # é ligada e desligada pelos scripts que sobem e destroem o cluster. Com ela
  # desligada o job aparece como "skipped" e a pipeline continua verde.
  deploy:
    name: Deploy (EKS)
    needs: [sonar, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Um deploy por vez; um push novo espera o anterior terminar em vez de cortá-lo.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      CLUSTER: autogiro
      NAMESPACE: autogiro
      SERVICE: os-service
      IMAGE: ghcr.io/figueiraa/autogiro-os-service
      KONG_PORT: "30080"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Acesso ao cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

      # Os valores vêm dos secrets do GitHub e nunca tocam o repositório. O
      # `apply` atualiza o Secret existente em vez de falhar por ele já existir.
      - name: Secret do serviço
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$SERVICE-secret" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Cada deploy aponta para a imagem imutável do commit, nunca para `latest`.
      - name: Imagem do commit
        run: |
          sed -i "s/newTag: latest/newTag: ${GITHUB_SHA}/" k8s/kustomization.yaml
          grep -q "newTag: ${GITHUB_SHA}" k8s/kustomization.yaml

      - name: Apply
        run: kubectl apply -k k8s/

      # Rollout que não termina (pod que não fica pronto, init container que
      # falha) desfaz a troca e reprova a pipeline: a versão anterior continua
      # atendendo.
      - name: Rollout
        run: |
          if ! kubectl -n "$NAMESPACE" rollout status "deploy/$SERVICE" --timeout=300s; then
            echo "::error::Rollout de $SERVICE não terminou; voltando para a versão anterior."
            kubectl -n "$NAMESPACE" get pods -l "app=$SERVICE" -o wide || true
            kubectl -n "$NAMESPACE" logs -l "app=$SERVICE" --all-containers --tail=50 || true
            kubectl -n "$NAMESPACE" rollout undo "deploy/$SERVICE"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail

          # 1. O Deployment roda a imagem deste commit, com todas as réplicas
          #    atualizadas e disponíveis (os pods antigos podem ainda estar saindo).
          imagem=$(kubectl -n "$NAMESPACE" get "deploy/$SERVICE" -o jsonpath='{.spec.template.spec.containers[0].image}')
          replicas=$(kubectl -n "$NAMESPACE" get "deploy/$SERVICE" \
            -o jsonpath='{.status.replicas} {.status.updatedReplicas} {.status.availableReplicas}')
          echo "Imagem: $imagem | réplicas (total, atualizadas, disponíveis): $replicas"
          [ "$imagem" = "$IMAGE:$GITHUB_SHA" ] || { echo "::error::Deployment com imagem $imagem"; exit 1; }
          read -r total atualizadas disponiveis <<< "$replicas"
          [ "$atualizadas" = "$total" ] && [ "$disponiveis" -ge "$total" ]

          # 2. Prontidão vista de dentro do pod novo: banco e broker respondendo.
          kubectl -n "$NAMESPACE" exec "deploy/$SERVICE" -- python -c \
            "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).read().decode())"

          # 3. Rota publicada no Kong: sem token, o gateway responde 401 (rota
          #    existe e o plugin JWT está ativo). 404 seria rota ausente.
          ip=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$ip:$KONG_PORT/api/v1/service-orders")
          echo "Kong em http://$ip:$KONG_PORT/api/v1/service-orders sem token: HTTP $codigo"
          [ "$codigo" = "401" ]

      - name: Evidência do deploy
        if: always()
        run: |
          {
            echo "### Deploy de $SERVICE no EKS"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Imagem | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| Revisão do Deployment | $(kubectl -n "$NAMESPACE" get "deploy/$SERVICE" -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' 2>/dev/null) |"
            echo ""
            echo '```'
            kubectl -n "$NAMESPACE" get pods -l "app=$SERVICE" -o wide 2>/dev/null || true
            echo ""
            kubectl -n "$NAMESPACE" rollout history "deploy/$SERVICE" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
