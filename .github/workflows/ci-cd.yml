name: CI/CD

# Pipeline de CI/CD do autogiro-os-service: build, testes e qualidade, independente dos outros serviços.
#
# Os nomes dos jobs são as checagens obrigatórias da `main` (ruleset
# main-protection): mudar um nome aqui exige atualizar o ruleset.
#   Lint & Test        -> ruff, bandit, pytest com cobertura mínima de 80%
#   SonarCloud         -> análise de qualidade com quality gate bloqueante
#   Build & Push image -> imagem Docker + scan de vulnerabilidades (trivy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: lint + segurança + testes com cobertura ───────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Security scan (bandit)
        run: bandit -r app -f screen -ll

      # O gate de 80% está no pytest.ini e reprova o job se a cobertura cair.
      - name: Tests (pytest + cobertura mínima de 80%)
        run: pytest

      - name: Coverage summary
        if: always()
        run: python scripts/test_report_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            report/junit.xml
            coverage.xml
            htmlcov/
          retention-days: 30

  # ─── Qualidade: SonarCloud com quality gate bloqueante ─────────────────────
  sonar:
    name: SonarCloud
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o SonarCloud usa o blame para identificar o código novo.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports

      # `sonar.qualitygate.wait=true` faz o job esperar o resultado do quality
      # gate e falhar se ele reprovar, bloqueando o merge pela checagem obrigatória.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ─── Build da imagem + scan de vulnerabilidades ────────────────────────────
  build:
    name: Build & Push image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Os nós do EKS são Graviton (t4g): a imagem publicada precisa de arm64.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Em PR: só amd64, carregada no Docker local para o scan. Nada é publicado.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Na main: amd64 + arm64, publicada com a tag do commit e `latest`.
      - name: Build and push (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Falha o job se a imagem tiver vulnerabilidade CRITICAL ou HIGH com correção disponível.
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
