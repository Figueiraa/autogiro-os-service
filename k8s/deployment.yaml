apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: autogiro
  labels:
    app: os-service
    app.kubernetes.io/part-of: autogiro
spec:
  # Sem `replicas`: quem decide é o HPA (mínimo 2). Com o campo no manifesto,
  # cada deploy voltaria a 2 réplicas e desfaria o que o HPA tivesse escalado.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
        app.kubernetes.io/part-of: autogiro
      annotations:
        # O agente do New Relic coleta direto do pod: a porta é a do container
        # (8000), não a do Service (80).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # O serviço não fala com a API do Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Aplica as migrations antes da API subir. Com duas réplicas subindo juntas, a trava
        # consultiva do PostgreSQL deixa uma aplicar e a outra esperar.
        - name: migrations
          image: ghcr.io/figueiraa/autogiro-os-service:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.infrastructure.migrations"]
          envFrom:
            - configMapRef:
                name: autogiro-plataforma
            - secretRef:
                name: autogiro-plataforma
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: os-service
          image: ghcr.io/figueiraa/autogiro-os-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: autogiro-plataforma
            - secretRef:
                name: autogiro-plataforma
            - configMapRef:
                name: os-service-config
            - secretRef:
                name: os-service-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Pronto só com banco e broker respondendo: sem isso o Kong mandaria
          # requisições para um pod que ainda não consome nem publica mensagens.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
