# Rotas do os-service no Kong. Os três serviços dividem o prefixo /api/v1, cada um
# com os seus recursos, então o gateway roteia pelo recurso e o caminho chega
# inteiro ao serviço (strip-path desligado).
#
# `autogiro-jwt` valida o token emitido pela Lambda autogiro-auth antes de
# encaminhar; `autogiro-prometheus` publica as métricas do gateway por rota. Os
# plugins são anexados por annotation: o label `global` foi depreciado e é
# ignorado em silêncio pelo ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-service
  namespace: autogiro
  annotations:
    konghq.com/plugins: autogiro-jwt,autogiro-prometheus
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/v1/clients
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  name: http
          - path: /api/v1/vehicles
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  name: http
          - path: /api/v1/service-types
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  name: http
          - path: /api/v1/service-orders
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  name: http
---
# Acompanhamento público da OS: o cliente consulta o status sem token. Só esta
# rota, por expressão regular (prefixo `/~` do Kong); o resto de
# /api/v1/service-orders continua exigindo JWT. A prioridade de regex garante
# que ela seja avaliada antes do prefixo protegido.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-service-publico
  namespace: autogiro
  annotations:
    konghq.com/plugins: autogiro-prometheus
    konghq.com/strip-path: "false"
    konghq.com/regex-priority: "100"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /~/api/v1/service-orders/\d+/status$
            pathType: ImplementationSpecific
            backend:
              service:
                name: os-service
                port:
                  name: http
