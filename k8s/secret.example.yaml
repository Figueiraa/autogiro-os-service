# FORMA do Secret do os-service; os valores são exemplos e não funcionam. Este
# arquivo não entra no kustomization: a pipeline cria o Secret a partir dos secrets
# do GitHub Actions, que nunca tocam o repositório.
#
# Criação manual:
#   kubectl -n autogiro create secret generic os-service-secret \
#     --from-literal=DATABASE_URL="$DATABASE_URL"
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secret
  namespace: autogiro
type: Opaque
stringData:
  # Banco próprio no Neon: saída `database_url` do terraform/ deste repositório.
  DATABASE_URL: "postgresql+asyncpg://autogiro_os_app:senha@ep-xxx.us-east-1.aws.neon.tech/autogiro_os?ssl=require"
