[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Relatórios gerados a cada execução:
#   term-missing -> resumo no terminal, com as linhas não cobertas
#   html         -> htmlcov/index.html
#   xml          -> coverage.xml (consumido pelo SonarCloud)
#   junitxml     -> report/junit.xml (resultado dos testes no CI e no SonarCloud)
# Cobertura mínima de 80%: abaixo disso o pytest reprova.
addopts =
    --strict-markers
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    --junitxml=report/junit.xml

markers =
    unit: testes de unidade (domínio, casos de uso e adapters isolados)
    integration: testes de integração via HTTP
